name: Build Fabric Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Fabric mod
        working-directory: mc
        run: ./gradlew.bat build --no-daemon
        shell: cmd

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: passthrough-mod
          path: mc/build/libs/passthrough-*.jar
