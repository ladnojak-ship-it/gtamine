name: Build GTA ASI Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  RESHADE_VERSION: '6.8.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ScriptHookV's SDK and ReShade's headers are fetched from their own sites (not redistributed here),
      # so they are cached: a build only downloads what it does not already have.
      - name: Cache third_party
        uses: actions/cache@v4
        with:
          path: gta/third_party
          key: third-party-${{ hashFiles('gta/fetch_deps.sh') }}

      - name: Fetch ScriptHookV SDK
        shell: bash
        run: |
          mkdir -p gta/third_party/shv gta/third_party/reshade gta/third_party/runtime
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          # dev-c.com drops connections now and then: retry before giving up
          RETRY="--retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 30"
          if [ -f gta/third_party/shv/ScriptHookV.lib ] && [ -f gta/third_party/runtime/ScriptHookV.dll ]; then
            echo "ScriptHookV already cached"
          else
            TMP=$(mktemp -d)
            curl -fsSL $RETRY -A "$UA" -H "Accept: text/html" https://www.dev-c.com/gtav/scripthookv/ -o "$TMP/shv.html"
            for f in $(grep -o '/files/ScriptHookV_[^"]*\.zip' "$TMP/shv.html" | sort -u); do
              curl -fsSL $RETRY -A "$UA" -H "Referer: https://www.dev-c.com/gtav/scripthookv/" "https://www.dev-c.com$f" -o "$TMP/$(basename $f)"
            done
            ls "$TMP"/ScriptHookV_SDK_*.zip >/dev/null 2>&1 || { echo "No SDK found"; exit 1; }
            unzip -qo "$TMP"/ScriptHookV_SDK_*.zip -d "$TMP/sdk"
            cp "$TMP"/sdk/inc/main.h "$TMP"/sdk/inc/nativeCaller.h "$TMP"/sdk/inc/types.h "$TMP"/sdk/lib/ScriptHookV.lib gta/third_party/shv/
            unzip -qo "$(ls "$TMP"/ScriptHookV_*.zip | grep -v SDK)" -d "$TMP/rt"
            cp "$TMP"/rt/bin/ScriptHookV.dll "$TMP"/rt/bin/dinput8.dll gta/third_party/runtime/
          fi

      - name: Fetch ReShade
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          TMP=$(mktemp -d)
          RETRY="--retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 30"
          curl -fsSL $RETRY -A "$UA" -H "Referer: https://reshade.me/" "https://reshade.me/downloads/ReShade_Setup_${{ env.RESHADE_VERSION }}_Addon.exe" -o "$TMP/reshade.exe"
          unzip -qo "$TMP/reshade.exe" ReShade64.dll -d "$TMP" 2>/dev/null || true
          cp "$TMP/ReShade64.dll" gta/third_party/runtime/
          for f in reshade.hpp reshade_api.hpp reshade_api_device.hpp reshade_api_pipeline.hpp reshade_api_resource.hpp reshade_api_format.hpp reshade_events.hpp reshade_overlay.hpp; do
            curl -fsSL "https://raw.githubusercontent.com/crosire/reshade/v${{ env.RESHADE_VERSION }}/include/$f" -o "gta/third_party/reshade/$f"
          done
          for f in ReShade.fxh ReShadeUI.fxh; do
            curl -fsSL "https://raw.githubusercontent.com/crosire/reshade-shaders/slim/Shaders/$f" -o "gta/third_party/$f"
          done

      - name: Build ASI plugin
        working-directory: gta
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { Write-Error "Visual Studio with C++ tools not found"; exit 1 }
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          Write-Output "Using: $vcvars"
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          $buildCmd = "call `"$vcvars`" && cl /nologo /LD /O2 /EHsc /std:c++20 /MT /W3 /DWIN32_LEAN_AND_MEAN /DNOMINMAX /I `"third_party\shv`" /I `"third_party\reshade`" `"src\script.cpp`" `"src\compositor.cpp`" `"src\ws.cpp`" /Fo`"build\\`" /Fe`"build\MCPassthrough.asi`" /link `"third_party\shv\ScriptHookV.lib`" ws2_32.lib user32.lib"
          cmd /c $buildCmd

      - name: Upload ASI plugin
        uses: actions/upload-artifact@v4
        with:
          name: mc-passthrough-asi
          path: gta/build/MCPassthrough.asi

      - name: Upload ScriptHookV runtime
        uses: actions/upload-artifact@v4
        with:
          name: scripthookv-runtime
          path: gta/third_party/runtime/
